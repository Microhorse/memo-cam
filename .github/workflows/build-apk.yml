name: Build MemoCamera APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk MemoCamera.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MemoCamera-apk
          path: MemoCamera.apk

      - name: Publish APK to GitHub Releases (Direct Download for Android)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "メモカメラ 最新ビルド (MemoCamera.apk)"
          body: |
            Androidスマートフォンでこのページを開き、下の **Assets** にある **`MemoCamera.apk`** をタップすると直接ダウンロード＆インストールできます。
          files: MemoCamera.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

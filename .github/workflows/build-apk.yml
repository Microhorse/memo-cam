name: Build MemoCamera APK and Google Play AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK, Release APK, and Google Play Release AAB
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Prepare Release Assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MemoCamera.apk
          cp app/build/outputs/apk/release/app-release.apk MemoCamera-release.apk
          cp app/build/outputs/bundle/release/app-release.aab MemoCamera-release.aab

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MemoCamera-store-bundle
          path: |
            MemoCamera.apk
            MemoCamera-release.apk
            MemoCamera-release.aab

      - name: Publish APK and AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "メモカメラ 最新ビルド (APK & Google Play提出用AAB)"
          body: |
            - **`MemoCamera.apk`**：スマートフォンで直接ダウンロード＆上書きアップデート用
            - **`MemoCamera-release.aab`**：Google Play Console 提出用（正式署名済み Android App Bundle）
            - **`MemoCamera-release.apk`**：正式署名済みリリースAPK
          files: |
            MemoCamera.apk
            MemoCamera-release.apk
            MemoCamera-release.aab
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
